name: tests

on:
  push:
    # the daily download count changes nothing that needs testing
    paths-ignore:
      - 'docs/guide/stats.json'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the Node tools
        run: cd tools/.node && npm ci
      - name: Formatting
        run: tools/.node/node_modules/.bin/prettier --check "web/js/*.js" "web/*.css" "tools/*.js" "ios/shim.js"
      - name: Build the content
        run: |
          python tools/build_content.py
          python tools/build_hadith.py
          python tools/build_kahf.py
      - name: Content tests
        run: node tools/test.js
      - name: Interface tests
        run: node tools/smoke.js
      - name: Android, Windows and iOS bridges match
        run: node tools/bridge-check.js

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the tools
        run: |
          cd tools/.node
          npm ci
          cd ../..
          pip install pillow
      - name: Build the content
        run: |
          python tools/build_content.py
          python tools/build_hadith.py
          python tools/build_kahf.py
      # the Windows app is Rust (windows/): the runner already has rustup's stable MSVC toolchain and the Windows SDK
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: cargo-${{ hashFiles('windows/Cargo.lock') }}
      - name: Build the Windows app and its installer
        run: python -I tools/build_windows.py
      - name: Rust lint and unit tests
        run: |
          cargo clippy --manifest-path windows/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path windows/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: Adhkar-Windows
          path: |
            dist/Adhkar-Windows.exe
            dist/Adhkar-Setup.exe

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the tools
        run: |
          cd tools/.node
          npm ci
          cd ../..
          pip install pillow
          brew install xcodegen ffmpeg
      - name: Build the content
        run: |
          python tools/build_content.py
          python tools/build_hadith.py
          python tools/build_kahf.py
      - name: Build and test the iOS app
        run: python -I tools/build_ios.py --test
      - uses: actions/upload-artifact@v7
        with:
          name: Adhkar-iOS
          path: |
            dist/Adhkar-iOS-unsigned.ipa
