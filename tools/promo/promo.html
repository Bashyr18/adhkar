  });

  /* ---------------------------------------------------------------- motion ---------------------------------------------------------------- */

  function words(el, lt, at) {

  }
  function phoneScene(s, el, lt) {
    var c = camAt(s.cam, lt), z = c[1];
    var wx = PAD + c[2] / 100 * SW, wy = PAD + c[3] / 100 * SH;

    el.querySelector('.gl').style.transform = 'translateX(' + lerp(-130, 130, seg(lt, .4, 2.4)) + '%)';

  }
  function sky(t) {

  var ctx = $('dust').getContext('2d'), P = [], rr = 9876;

      } else {
