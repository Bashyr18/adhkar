# Adhkār for Windows, in Rust: the window around the app (app), the installer people download (setup),
# and what both share (common: installing, the Windows plumbing, the WebView2 helpers).
[workspace]
resolver = "2"
members = ["app", "setup", "common"]

[workspace.package]
edition = "2021"
license = "GPL-3.0"

[workspace.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = [
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO",
  "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Power",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Variant",
  "Win32_Security", "Win32_UI_Controls", "Win32_System_WindowsProgramming", "Win32_Globalization",
  "Devices_Geolocation", "Foundation",
] }
windows-core = "0.61.2"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
