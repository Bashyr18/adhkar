<!doctype html>
<!-- The installer's brand panel, drawn with the app's own fonts and rosette, saved as pictures by tools/setup-art.js
     (windows/setup/art-*.png). ?light for the light theme, ?ar for Arabic. -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Quicksand'; font-weight: 400 700; src: url(../../web/fonts/Quicksand-400-700-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: 'Quicksand'; font-weight: 400 700; src: url(../../web/fonts/Quicksand-400-700-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02FF, U+1E00-1EFF; }
@font-face { font-family: 'Amiri'; font-weight: 700; src: url(../../web/fonts/Amiri-700-arabic.woff2) format('woff2'); unicode-range: U+0600-06FF, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: 'Plex'; font-weight: 600; src: url(../../web/fonts/PlexArabic-600.woff2) format('woff2'); }
html, body { margin: 0; width: 260px; height: 470px; overflow: hidden; }
body {
  --t1: #f5f0e7; --t2: rgba(245, 240, 231, .66); --g1: #f6dfaa; --g2: #b8873a; --star: rgba(246, 223, 170, .9);
  background:
    radial-gradient(120% 60% at 20% 108%, rgba(222, 160, 90, .55), transparent 60%),
    radial-gradient(90% 40% at 50% 0%, rgba(90, 100, 190, .22), transparent 70%),
    linear-gradient(180deg, #06070e 0%, #0d1130 46%, #241f45 78%, #4a3448 100%);
  font-family: 'Quicksand', sans-serif; color: var(--t1); position: relative;
}
body.light {
  --t1: #1c1812; --t2: rgba(40, 32, 20, .62); --g1: #b8862f; --g2: #7d561a; --star: rgba(160, 116, 44, .55);
  background:
    radial-gradient(120% 60% at 20% 108%, rgba(240, 170, 90, .55), transparent 60%),
    radial-gradient(90% 40% at 50% 0%, rgba(255, 255, 255, .8), transparent 70%),
    linear-gradient(180deg, #fbf7ef 0%, #f6ecda 50%, #f0dcba 80%, #eac48e 100%);
}
svg.bg { position: absolute; inset: 0; }
.top { position: absolute; left: 0; right: 0; top: 64px; text-align: center; }
.top .ro { display: block; margin: 0 auto 18px; filter: drop-shadow(0 8px 26px rgba(241, 213, 158, .35)); }
.light .top .ro { filter: drop-shadow(0 8px 22px rgba(160, 110, 40, .3)); }
.en { font-weight: 700; font-size: 34px; letter-spacing: -.01em; line-height: 1; }
.ar { font-family: 'Amiri', serif; font-weight: 700; font-size: 40px; line-height: 1.5; margin-top: 2px;
      background: linear-gradient(180deg, var(--g1), var(--g2)); -webkit-background-clip: text; background-clip: text; color: transparent; direction: rtl; }
.tag { text-wrap: balance; margin: 10px 26px 0; font-size: 10px; font-weight: 700; letter-spacing: .16em; line-height: 1.6; text-transform: uppercase; color: var(--t2); }
.rtl .tag { font-family: 'Plex', sans-serif; font-weight: 600; letter-spacing: 0; font-size: 13px; text-transform: none; }
</style>
</head>
<body>
<svg class="bg" viewBox="0 0 260 470" width="260" height="470">
  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--g1)" stop-opacity="0"/><stop offset=".45" stop-color="#f1d59e" stop-opacity=".75"/><stop offset="1" stop-color="#f1d59e" stop-opacity=".1"/></linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff4d6"/><stop offset=".35" stop-color="#f1d59e"/><stop offset="1" stop-color="#f1d59e" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="stars"></g>
  <g id="khatam" opacity=".07"></g>
  <path id="path" d="M-20 455 Q 130 300 280 455" fill="none" stroke="url(#arc)" stroke-width="1.4" stroke-dasharray="2 5"/>
  <circle cx="62" cy="389" r="22" fill="url(#sun)"/>
  <circle cx="62" cy="389" r="5.5" fill="#fff6dd"/>
</svg>
<div class="top">
  <svg class="ro" id="ro" viewBox="0 0 120 120" width="96" height="96"></svg>
  <div class="en">Adhkār</div>
  <div class="ar">أذكار</div>
  <div class="tag" id="tag">Remembrance for every moment</div>
</div>
<script>
  var light = /light/.test(location.search), ar = /ar/.test(location.search.replace('dark', ''));
  if (light) { document.body.classList.add('light'); document.querySelectorAll('#arc stop').forEach(function (x) { x.setAttribute('stop-color', '#9a6b22'); }); }
  if (ar) { document.body.classList.add('rtl'); document.getElementById('tag').textContent = 'ذكر لكل لحظة'; }
  /* the app's rosette (web/js/ui.js A.rosette, A.starPath) */
  function star(cx, cy, R, r) {
    var p = [];
    for (var i = 0; i < 16; i++) { var a = (Math.PI / 8) * i - Math.PI / 2, rr = i % 2 ? r : R; p.push((cx + rr * Math.cos(a)).toFixed(2) + ' ' + (cy + rr * Math.sin(a)).toFixed(2)); }
    return 'M' + p.join('L') + 'Z';
  }
  var g1 = light ? '#c99a45' : '#f6dfaa', g2 = light ? '#7d561a' : '#b8873a';
  var h = '<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + g1 + '"/><stop offset="1" stop-color="' + g2 + '"/></linearGradient>' +
    '<radialGradient id="rgc"><stop offset="0" stop-color="rgba(241,213,158,' + (light ? .28 : .35) + ')"/><stop offset="1" stop-color="rgba(241,213,158,0)"/></radialGradient></defs><circle cx="60" cy="60" r="58" fill="url(#rgc)"/>';
  for (var i = 0; i < 3; i++) h += '<path d="' + star(60, 60, 54 - i * 15, 42 - i * 12) + '" fill="none" stroke="url(#rg)" stroke-width="' + (1.6 - i * .3) + '" opacity="' + (1 - i * .22) + '"/>';
  h += '<path d="' + star(60, 60, 13, 9) + '" fill="url(#rg)"/>';
  document.getElementById('ro').innerHTML = h;
  /* a quiet sky: the same stars every time */
  var seed = 7, rnd = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }, st = '';
  for (var k = 0; k < 46; k++) { var x = rnd() * 260, y = rnd() * 330, r = rnd() * .9 + .3; st += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(2) + '" fill="var(--star)" opacity="' + (.25 + rnd() * .6).toFixed(2) + '"/>'; }
  document.getElementById('stars').innerHTML = st;
  /* a faint khātam lattice behind it all */
  var kh = '';
  for (var yy = -20; yy < 500; yy += 52) for (var xx = (yy / 52) % 2 ? 0 : 26; xx < 290; xx += 52) kh += '<path d="' + star(xx, yy, 20, 15) + '" fill="none" stroke="' + (light ? '#7d561a' : '#f1d59e') + '" stroke-width=".8"/>';
  document.getElementById('khatam').innerHTML = kh;
  document.fonts.ready.then(function () { window.ready = 1; });
</script>
</body>
</html>
